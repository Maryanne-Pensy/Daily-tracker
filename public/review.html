<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Review · Builder OS</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/coach.css">
  <style>
    .week-nav { display: flex; align-items: center; gap: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
    .facts { list-style: none; padding: 0; margin: 0 0 6px; font-size: 14px; }
    .facts li { padding: 4px 0; border-bottom: 1px solid var(--paper-line); display: flex; justify-content: space-between; gap: 10px; }
    .facts li b { font-family: 'IBM Plex Mono', monospace; }
    .big-q { font-size: 18px; margin: 0 0 8px; }
    .os-section textarea { width: 100%; }
  </style>
</head>
<body>

<div id="globalNavbar"></div>

<div class="page-container">
  <div class="page-header">
    <div>
      <h1 class="page-title">Weekly Review</h1>
      <p class="page-subtitle" id="weekLabel">Loading...</p>
    </div>
    <div class="week-nav">
      <button class="btn-outline" id="prevWeek">← prev</button>
      <button class="btn-outline" id="nextWeek">next →</button>
    </div>
  </div>

  <div id="reviewBody"></div>
</div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/coach.js"></script>
<script src="/js/review.js"></script>
</body>
</html>
