<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outreach Board · Daily Tracker</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/coach.css">
  <style>
    .outreach-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-card {
      border: 1px solid var(--card-edge);
      background: var(--card-bg);
      padding: 12px 14px;
    }
    .stat-card .val {
      font-size: 22px;
      font-weight: 700;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--rust);
    }
    .stat-card .lbl {
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--ink-soft);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .lead-table-wrap {
      border: 1px solid var(--card-edge);
      background: #FAF6EC;
      overflow-x: auto;
    }

    table.lead-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13.5px;
    }

    table.lead-table th {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--ink-soft);
      background: var(--paper-line);
      padding: 10px 14px;
      border-bottom: 1px solid var(--card-edge);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    table.lead-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--card-edge);
      vertical-align: top;
    }

    table.lead-table tr:hover {
      background: #FFFDF9;
    }

    .lead-name {
      font-weight: 600;
      font-size: 15px;
    }

    .lead-link {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--teal);
      text-decoration: none;
      display: block;
      margin-top: 3px;
    }

    .lead-link:hover {
      text-decoration: underline;
    }

    .gap-text {
      font-size: 12.5px;
      color: var(--ink-soft);
      line-height: 1.4;
    }

    /* Modal Form */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(35, 38, 31, 0.6);
      backdrop-filter: blur(2px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 20px;
    }
    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-box {
      background: var(--paper);
      border: 1px solid var(--ink);
      width: 100%;
      max-width: 580px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body>

<div id="globalNavbar"></div>

<div class="page-container wide">
  <div class="page-header">
    <div>
      <h1 class="page-title">Outreach Board</h1>
      <p class="page-subtitle">Track client research, sample drafts, and pitch status (Blocks 1, 2, & 4)</p>
    </div>
    <div>
      <button class="btn-primary" id="addLeadBtn">+ Add Client Prospect</button>
    </div>
  </div>

  <div class="outreach-stats">
    <div class="stat-card">
      <div class="val" id="statTotalLeads">0</div>
      <div class="lbl">Total Prospects</div>
    </div>
    <div class="stat-card">
      <div class="val" id="statSent">0</div>
      <div class="lbl">Pitches Sent</div>
    </div>
    <div class="stat-card">
      <div class="val" id="statReplied">0</div>
      <div class="lbl">Responses / Talks</div>
    </div>
    <div class="stat-card">
      <div class="val" id="statClosed">0</div>
      <div class="lbl">Deals Closed</div>
    </div>
  </div>

  <div class="toolbar">
    <div style="font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft);">
      Client Pipeline
    </div>
    <div class="filter-group">
      <button class="btn-outline" style="font-size:11px;" id="filterAll">Show All</button>
      <button class="btn-outline" style="font-size:11px;" id="filterSent">Sent Only</button>
    </div>
  </div>

  <div class="lead-table-wrap">
    <table class="lead-table">
      <thead>
        <tr>
          <th style="width:25%;">Client / Store</th>
          <th style="width:30%;">Visible Gaps & Angle</th>
          <th style="width:20%;">Pitch Sample</th>
          <th style="width:15%;">Status</th>
          <th style="width:10%;">Actions</th>
        </tr>
      </thead>
      <tbody id="leadTableBody">
        <tr>
          <td colspan="5" style="text-align:center; padding:30px; font-family:'IBM Plex Mono', monospace; color:var(--ink-soft);">
            Loading client prospects...
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal to add/edit lead -->
<div class="modal-backdrop" id="leadModal">
  <div class="modal-box">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--card-edge); padding-bottom:12px; margin-bottom:16px;">
      <h2 style="font-size:18px; margin:0;" id="leadModalTitle">Add Client Prospect</h2>
      <button style="background:none; border:none; font-size:20px; cursor:pointer;" id="leadModalCloseBtn">✕</button>
    </div>

    <form id="leadForm">
      <input type="hidden" id="leadIdInput">

      <div class="form-group">
        <label>Client / Brand Name *</label>
        <input type="text" id="leadNameInput" placeholder="e.g. Lumina Apparel" required style="width:100%;">
      </div>

      <div class="form-group">
        <label>Store Website / Profile URL</label>
        <input type="url" id="leadUrlInput" placeholder="https://shop.example.com" style="width:100%;">
      </div>

      <div class="form-group">
        <label>Contact Email / LinkedIn</label>
        <input type="text" id="leadContactInput" placeholder="founder@example.com" style="width:100%;">
      </div>

      <div class="form-group">
        <label>Visible Email Gaps / Store Angle (Block 1)</label>
        <textarea id="leadGapsInput" rows="3" placeholder="No abandoned cart flow, generic welcome discount, weak subject lines..." style="width:100%;"></textarea>
      </div>

      <div class="form-group">
        <label>Email Pitch Sample Draft (Block 2)</label>
        <textarea id="leadSampleInput" rows="4" placeholder="Draft your tailored sample email pitch..." style="width:100%;"></textarea>
      </div>

      <div class="form-group">
        <label>Status (Block 4: Send)</label>
        <select id="leadStatusInput" style="width:100%;">
          <option value="researching">Researching (Block 1)</option>
          <option value="drafted">Sample Drafted (Block 2)</option>
          <option value="sent">Pitch Sent (Block 4)</option>
          <option value="replied">Client Replied (Trade IQ)</option>
          <option value="closed">Closed / Retainer Signed 🎯</option>
        </select>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
        <button type="button" class="btn-outline" id="leadCancelBtn">Cancel</button>
        <button type="submit" class="btn-primary" id="leadSaveBtn">Save Prospect</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/coach.js"></script>
<script src="/js/outreach.js"></script>
</body>
</html>
