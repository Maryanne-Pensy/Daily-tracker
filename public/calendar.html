<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Calendar · Daily Tracker</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/coach.css">
  <style>
    .cal-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-card {
      border: 1px solid var(--card-edge);
      background: var(--card-bg);
      padding: 12px 14px;
    }
    .stat-card .val {
      font-size: 22px;
      font-weight: 700;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--teal);
    }
    .stat-card .lbl {
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--ink-soft);
      text-transform: uppercase;
      margin-top: 2px;
    }
    .cal-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }
    .filter-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .filter-btn {
      font-size: 11px;
      padding: 6px 10px;
      border: 1px solid var(--card-edge);
      background: none;
      color: var(--ink-soft);
    }
    .filter-btn.active {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }
    .cal-item {
      border: 1px solid var(--card-edge);
      background: #FAF6EC;
      padding: 16px 18px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      transition: all 0.2s;
    }
    .cal-item:hover {
      border-color: var(--teal);
      background: #FFFDF9;
    }
    .cal-item.status-posted {
      border-left: 4px solid var(--teal);
      background: #F0F6F4;
    }
    .cal-item.status-drafted {
      border-left: 4px solid #D9A036;
    }
    .cal-item.status-recorded {
      border-left: 4px solid #3A86C8;
    }
    .cal-item.status-pending {
      border-left: 4px solid var(--card-edge);
    }
    .cal-meta {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--ink-soft);
      margin-bottom: 4px;
    }
    .cal-title {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 6px 0;
      line-height: 1.4;
    }
    .cal-preview {
      font-size: 12.5px;
      color: var(--ink-soft);
      font-style: italic;
      line-height: 1.4;
    }
    .cal-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }
    .status-select {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      padding: 4px 8px;
    }

    /* Modal / Drawer */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(35, 38, 31, 0.6);
      backdrop-filter: blur(2px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 20px;
    }
    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-box {
      background: var(--paper);
      border: 1px solid var(--ink);
      width: 100%;
      max-width: 600px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--card-edge);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--ink-soft);
    }
  </style>
</head>
<body>

<div id="globalNavbar"></div>

<div class="page-container wide">
  <div class="page-header">
    <div>
      <h1 class="page-title">Content Calendar</h1>
      <p class="page-subtitle">30-Day Email Copywriting sequence & script pipeline</p>
    </div>
    <div style="font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft);">
      Block 5 Focus
    </div>
  </div>

  <div class="cal-stats">
    <div class="stat-card">
      <div class="val" id="statPosted">0</div>
      <div class="lbl">Posted / Live</div>
    </div>
    <div class="stat-card">
      <div class="val" id="statDrafted">0</div>
      <div class="lbl">Drafted / In Progress</div>
    </div>
    <div class="stat-card">
      <div class="val" id="statPending">30</div>
      <div class="lbl">Pending</div>
    </div>
  </div>

  <div class="cal-controls">
    <div class="filter-group">
      <button class="filter-btn active" data-filter="all">All (30)</button>
      <button class="filter-btn" data-filter="pending">Pending</button>
      <button class="filter-btn" data-filter="drafted">Drafted</button>
      <button class="filter-btn" data-filter="recorded">Recorded</button>
      <button class="filter-btn" data-filter="posted">Posted</button>
    </div>
  </div>

  <div id="calendarList">
    <div style="font-family:'IBM Plex Mono', monospace; color:var(--ink-soft);">Loading content schedule...</div>
  </div>
</div>

<!-- Edit Script Modal -->
<div class="modal-backdrop" id="editModal">
  <div class="modal-box">
    <div class="modal-header">
      <div>
        <div class="badge badge-teal" id="modalDayBadge">Day 1</div>
        <h2 style="font-size:18px; margin:6px 0 0;" id="modalTitle">Script Details</h2>
      </div>
      <button class="modal-close" id="modalCloseBtn">✕</button>
    </div>

    <div class="form-group">
      <label>Status</label>
      <select id="modalStatusSelect" style="width:100%;">
        <option value="pending">Pending (Not Started)</option>
        <option value="drafted">Drafted (Script Written)</option>
        <option value="recorded">Recorded (Audio/Video Complete)</option>
        <option value="posted">Posted / Published</option>
      </select>
    </div>

    <div class="form-group">
      <label>Content Title / Topic</label>
      <input type="text" id="modalTopicInput" style="width:100%;">
    </div>

    <div class="form-group">
      <label>Script / Copy Draft</label>
      <textarea id="modalScriptInput" rows="6" style="width:100%;" placeholder="Write your full hook, bullet points, or email script draft here..."></textarea>
    </div>

    <div class="form-group">
      <label>Visuals & Production Notes</label>
      <textarea id="modalNotesInput" rows="3" style="width:100%;" placeholder="Editing notes, visuals needed, hashtags, target platform..."></textarea>
    </div>

    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
      <button class="btn-outline" id="modalCancelBtn">Cancel</button>
      <button class="btn-primary" id="modalSaveBtn">Save Changes</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/coach.js"></script>
<script src="/js/calendar.js"></script>
</body>
</html>
