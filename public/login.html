<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In · Daily Sheet</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/layout.css">
  <style>
    .auth-wrap {
      max-width: 440px;
      margin: 80px auto 40px;
      padding: 0 20px;
    }
    .auth-card {
      border: 1px solid var(--card-edge);
      background: var(--card-bg);
      padding: 32px 28px;
    }
    .auth-brand {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      letter-spacing: 1px;
      color: var(--teal);
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .auth-title {
      font-size: 26px;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11.5px;
      color: var(--ink-soft);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .form-group input {
      width: 100%;
    }
    .auth-btn {
      width: 100%;
      margin-top: 10px;
    }
    .auth-footer {
      margin-top: 24px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--ink-soft);
      text-align: center;
      line-height: 1.5;
    }
    .error-msg {
      background: #FCE8E6;
      border-left: 3px solid var(--rust);
      padding: 10px 12px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--rust-dark);
      margin-bottom: 18px;
      display: none;
    }
  </style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">Daily Sheet Tracker</div>
    <h1 class="auth-title" id="formTitle">Sign In</h1>

    <div class="error-msg" id="authError"></div>

    <form id="authForm">
      <div class="form-group">
        <label for="emailInput">Email Address</label>
        <input type="email" id="emailInput" placeholder="you@example.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="passwordInput">Password</label>
        <input type="password" id="passwordInput" placeholder="••••••••" required minlength="6" autocomplete="current-password">
      </div>

      <button type="submit" class="btn-primary auth-btn" id="submitBtn">Sign In</button>
    </form>
  </div>

  <div class="auth-footer">
    Multi-page tracking with MongoDB & Harsh AI Coach.<br>
    Your progress and streaks are tied directly to your account.
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  const formTitle = document.getElementById('formTitle');
  const submitBtn = document.getElementById('submitBtn');
  const authError = document.getElementById('authError');
  const authForm = document.getElementById('authForm');

  authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    authError.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Processing...';

    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error || 'Authentication failed');
      }

      API.setSession(data.token, data.user);
      window.location.href = '/today.html';
    } catch (err) {
      authError.textContent = err.message;
      authError.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
    }
  });

  // If already logged in, redirect to today
  if (API.getToken()) {
    window.location.href = '/today.html';
  }
</script>
</body>
</html>
