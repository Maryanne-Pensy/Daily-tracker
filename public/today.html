<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Today · Builder OS</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/coach.css">
  <style>
    .today-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      border-bottom: 1px solid var(--card-edge);
      padding-bottom: 14px;
      margin-bottom: 12px;
    }
    .today-top h1 { font-size: 28px; margin: 0; }
    .today-date { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
    .phase {
      display: inline-block;
      margin-top: 8px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      padding: 3px 8px;
      background: var(--teal);
      color: var(--paper);
      letter-spacing: 0.4px;
    }
    .score-box { text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); line-height: 1.5; }
    .score-box .num { font-size: 22px; font-weight: 700; color: var(--teal); }
    .score-box .streak-num { color: var(--rust); font-weight: 700; font-size: 14px; }
    .score-items { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 16px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-muted); }
    .score-items .on { color: var(--teal); font-weight: 600; }
    .score-items .half { color: #9A7B2F; }
    .mission-row { display: flex; align-items: center; gap: 10px; }
    .mission-row input[type="checkbox"] { width: 24px; height: 24px; accent-color: var(--teal); flex-shrink: 0; }
    .mission-row.done .big-input { text-decoration: line-through; color: var(--ink-muted); }
    .video-row { padding: 10px 0; border-bottom: 1px solid var(--paper-line); }
    .video-row:last-child { border-bottom: none; }
    .video-row .video-label { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; color: var(--ink-soft); margin-bottom: 4px; display: flex; justify-content: space-between; }
    .video-row.posted .video-label { color: var(--teal); }
    .video-controls { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .video-controls select { flex: 1 1 110px; }
    .posted-count { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 700; }
    .posted-count.met { color: var(--teal); }
    .slotly-post { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--card-edge); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13.5px; }
    .slotly-post .t { flex: 1 1 200px; }
    .learn-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft); }
    .learn-row input { width: 64px; }
    .learn-row input.module { width: 150px; }
    .footer-actions { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
  </style>
</head>
<body>

<div id="globalNavbar"></div>

<div class="page-container">
  <div class="today-top">
    <div>
      <h1>Today</h1>
      <div class="today-date" id="dateLabel">Loading...</div>
      <span class="phase" id="phaseLabel"></span>
    </div>
    <div class="score-box">
      today's score<br>
      <span class="num" id="scoreNum">0</span> / <span id="scoreMax">5</span><br>
      streak <span class="streak-num" id="streakNum">0</span>
    </div>
  </div>
  <div class="score-items" id="scoreItems"></div>

  <div id="banners"></div>

  <div id="sections">
    <!-- Slotly: the main mission -->
    <section class="os-section primary" id="secSlotly">
      <div class="section-head">
        <span class="section-label">🔥 Main mission · Slotly</span>
        <span class="section-meta">Did I move Slotly closer to a paying clinic today?</span>
      </div>

      <label class="field-label" for="missionInput">Today's highest-value task</label>
      <div class="mission-row" id="missionRow">
        <input type="checkbox" id="missionDone" title="Done">
        <input type="text" class="big-input" id="missionInput" placeholder="e.g. Finish payment integration">
      </div>

      <label class="field-label">Slotly checklist</label>
      <ul class="check-list" id="slotlyChecklist"></ul>
      <button class="link-btn" id="addChecklistBtn">+ add checklist item</button>

      <label class="field-label">Push the needle — actions that actually moved it</label>
      <ul class="check-list" id="needleList"></ul>
      <form class="add-row" id="needleForm">
        <select id="needleCategory" class="compact">
          <option value="build">Build</option>
          <option value="customers">Customers</option>
          <option value="validation">Validation</option>
        </select>
        <input type="text" id="needleText" class="compact" placeholder="Fix booking bug · DM 5 clinics · Ask about their workflow">
        <button type="submit" class="btn-outline">Add</button>
      </form>

      <label class="field-label">Progress</label>
      <div class="progress-row" style="margin-bottom:8px;">
        <span id="milestoneText" style="flex:0 1 auto;"></span>
        <div class="progress-track"><div class="progress-fill" id="slotlyProgress"></div></div>
        <span id="slotlyProgressPct">0%</span>
      </div>
      <div class="mini-stats" id="slotlyStats"></div>

      <div class="slotly-post hidden" id="slotlyPost"></div>
    </section>

    <!-- Digital products + content -->
    <section class="os-section" id="secContent">
      <div class="section-head">
        <span class="section-label">🎥 Digital product content</span>
        <span class="posted-count" id="postedCount">0 / 2 posted today</span>
      </div>
      <div id="videoRows"></div>
      <button class="link-btn" id="addVideoBtn">+ another video</button>

      <div style="margin-top:14px;">
        <label class="check-inline"><input type="checkbox" id="productWork"> Worked on a digital product today</label>
        <input type="text" class="full compact" id="productWorkNote" style="margin-top:6px;" placeholder="What I built / improved (e.g. Cybersecurity Guide: rewrote chapter 2)">
      </div>
    </section>

    <!-- Learning -->
    <section class="os-section" id="secLearning">
      <div class="section-head">
        <span class="section-label">🧠 Learning</span>
        <a class="section-meta" href="/focus.html#learning">key lessons →</a>
      </div>
      <div class="learn-row" id="learningRow"></div>
      <input type="text" class="full compact" id="learningNote" style="margin-top:8px;" placeholder="Today's lesson — and where I'll apply it">
      <div style="margin-top:8px;">
        <label class="check-inline"><input type="checkbox" id="learningDone"> Did today's learning</label>
      </div>
    </section>

    <!-- TradeIQ: weekend project -->
    <section class="os-section quiet" id="secWeekend"></section>

    <!-- Parking lot -->
    <section class="os-section quiet" id="secParking">
      <div class="section-head" style="margin-bottom:6px;">
        <span class="section-label">💡 Parking lot</span>
        <span class="section-meta"><span id="parkedCount">0</span> parked ideas · <a href="/focus.html#parking">View</a></span>
      </div>
      <form class="add-row" id="parkForm">
        <input type="text" id="parkInput" class="compact" placeholder="New idea? Park it here and get back to work.">
        <button type="submit" class="btn-outline">Park it</button>
      </form>
    </section>
  </div>

  <div class="footer-actions">
    <button class="btn-outline" id="resetBtn">uncheck everything today</button>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/coach.js"></script>
<script src="/js/today.js"></script>
</body>
</html>
