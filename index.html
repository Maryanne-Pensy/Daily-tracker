<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today's Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EDE7D6;
    --paper-line: #D9D0B8;
    --ink: #23261F;
    --ink-soft: #5B5A4E;
    --teal: #1F5C52;
    --rust: #B5502A;
    --card-edge: #C9C0A4;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Lora', serif;
    min-height:100vh;
  }
  .wrap{
    max-width:460px;
    margin:0 auto;
    padding:28px 20px 60px;
  }
  .top{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:1px solid var(--card-edge);
    padding-bottom:14px;
    margin-bottom:22px;
  }
  .top h1{
    font-size:26px;
    font-weight:600;
    margin:0;
    letter-spacing:0.2px;
  }
  .top .date{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .streak{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    text-align:right;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .streak .num{
    font-size:20px;
    color:var(--rust);
    font-weight:600;
  }
  .progress-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:24px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  .progress-track{
    flex:1;
    height:6px;
    background:var(--paper-line);
    position:relative;
    overflow:hidden;
  }
  .progress-fill{
    position:absolute;
    left:0;top:0;bottom:0;
    background:var(--teal);
    width:0%;
    transition:width 0.4s ease;
  }
  .block{
    border-top:1px solid var(--card-edge);
    padding:16px 0;
    display:flex;
    gap:14px;
    align-items:flex-start;
  }
  .block:last-of-type{
    border-bottom:1px solid var(--card-edge);
  }
  .checkbox{
    flex-shrink:0;
    width:22px;
    height:22px;
    border:1.5px solid var(--ink);
    margin-top:3px;
    cursor:pointer;
    position:relative;
    background:transparent;
  }
  .checkbox.checked{
    background:var(--teal);
    border-color:var(--teal);
  }
  .checkbox.checked::after{
    content:'';
    position:absolute;
    left:6px; top:2px;
    width:6px; height:11px;
    border:solid var(--paper);
    border-width:0 2px 2px 0;
    transform:rotate(40deg);
  }
  .block-body{flex:1;}
  .block-time{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.4px;
  }
  .block-title{
    font-size:17px;
    font-weight:600;
    margin:3px 0 4px;
    transition:opacity 0.3s ease;
  }
  .block-title.done{
    text-decoration:line-through;
    text-decoration-color:var(--ink-soft);
    opacity:0.5;
  }
  .block-desc{
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.5;
    font-family:'Lora', serif;
    font-style:italic;
  }
  .protected{
    color:var(--rust);
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.3px;
    margin-top:6px;
    display:inline-block;
  }
  .footer-note{
    margin-top:26px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    text-align:center;
    line-height:1.6;
  }
  .reset-btn{
    display:block;
    margin:18px auto 0;
    background:none;
    border:1px solid var(--card-edge);
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    padding:8px 14px;
    cursor:pointer;
  }
  .reset-btn:hover{
    border-color:var(--ink-soft);
  }
  .tracker-actions{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:18px;
  }
  .notify-btn{
    background:none;
    border:1px solid var(--teal);
    color:var(--teal);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    padding:8px 14px;
    cursor:pointer;
  }
  .notify-btn:hover{
    background:var(--teal);
    color:var(--paper);
  }
  .toast{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translate(-50%, 16px);
    width:min(360px, calc(100% - 32px));
    padding:12px 16px;
    background:var(--ink);
    color:var(--paper);
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    line-height:1.5;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease;
  }
  .toast.show{
    opacity:1;
    transform:translate(-50%, 0);
  }
  .content-card{
    border:1px solid var(--card-edge);
    background:#F5F0E1;
    padding:14px 16px;
    margin-bottom:24px;
  }
  .content-card .label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.4px;
    color:var(--teal);
    text-transform:uppercase;
  }
  .content-card.off .label{
    color:var(--ink-soft);
  }
  .content-card .ctitle{
    font-size:16px;
    font-weight:600;
    margin-top:6px;
    line-height:1.4;
  }
  .content-card .cmeta{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .content-card .next-hint{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:4px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Today's Sheet</h1>
      <div class="date" id="dateLabel"></div>
    </div>
    <div class="streak">
      streak<br>
      <span class="num" id="streakNum">0</span>
    </div>
  </div>

  <div class="content-card" id="contentCard"></div>

  <div class="progress-row">
    <span id="progressLabel">0 / 6</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div id="blocks"></div>

  <div class="footer-note">
    protect the sheet — an unchecked block today doesn't erase yesterday's streak.<br>
    it just means today wasn't finished yet.
  </div>
  <div class="tracker-actions">
    <button class="notify-btn" id="notifyBtn">enable notifications</button>
    <button class="reset-btn" id="resetBtn">reset today</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const BLOCKS = [
  {
    time: "Block 1 · 45–60 min",
    title: "Research 3 clients",
    desc: "Pull store profile, visible email gaps, likely customer for each."
  },
  {
    time: "Block 2 · 90–120 min",
    title: "Write 3 email samples",
    desc: "Draft yourself first — slow and rough beats fast and borrowed."
  },
  {
    time: "Block 3 · 30–45 min",
    title: "Editing pass",
    desc: "Bring drafts in for review. Revise before moving on."
  },
  {
    time: "Block 4 · 45–60 min",
    title: "Send outreach",
    desc: "Pitch with the finished samples attached."
  },
  {
    time: "Block 5 · 60–90 min",
    title: "Content — script + edit",
    desc: "Write your own first draft. Then editing pass, then visuals."
  },
  {
    time: "Block 6 · 60–90 min",
    title: "Trade IQ",
    desc: "One real move forward — feedback, a fix, or outreach.",
    protectedNote: "PROTECTED — do not skip for overrun"
  }
];

const CONTENT_CALENDAR = [
{date:"2026-09-07", day:1, title:"I Gave ChatGPT a Product to Sell. Here's What It Got Wrong."},
{date:"2026-09-09", day:2, title:"Why AI Copy Always Sounds Like AI Copy"},
{date:"2026-09-11", day:3, title:"I Asked AI to Write an Abandoned Cart Email — Then Rewrote It Line by Line"},
{date:"2026-09-14", day:4, title:"The One Thing AI Can't Do in Email Copy (and Why It's the Whole Job)"},
{date:"2026-09-16", day:5, title:"AI Wrote the First Draft of This Welcome Email. Here's My Editing Process."},
{date:"2026-09-18", day:6, title:"Why Your Abandoned Cart Email Isn't Bringing People Back"},
{date:"2026-09-21", day:7, title:"The Welcome Email Most Shopify Stores Get Wrong"},
{date:"2026-09-23", day:8, title:"Post-Purchase Emails: The Missed Opportunity Nobody Talks About"},
{date:"2026-09-25", day:9, title:"Why Your Win-Back Email Isn't Winning Anyone Back"},
{date:"2026-09-28", day:10, title:"I Audited a Shopify Store's Full Email Flow in 10 Minutes"},
{date:"2026-09-30", day:11, title:"5 Things I Check in Every Email Flow Audit"},
{date:"2026-10-02", day:12, title:"The First Line of Your Email Decides If It Gets Read — Here's How to Nail It"},
{date:"2026-10-05", day:13, title:"I Rewrote a Terrible Abandoned Cart Email"},
{date:"2026-10-07", day:14, title:"Same Product, Two Different Buyers — Watch the Email Copy Change"},
{date:"2026-10-09", day:15, title:"I Removed Half the Words From This Email Without Losing the Message"},
{date:"2026-10-12", day:16, title:"The Client Who Taught Me Features Don't Sell — Outcomes Do"},
{date:"2026-10-14", day:17, title:"Why \"Don't Miss Out\" Is Weak Subject Line Copy (and What Works Instead)"},
{date:"2026-10-16", day:18, title:"How I Find the Real Objection Behind Every \"Why Didn't They Buy\""},
{date:"2026-10-19", day:19, title:"The Difference Between a Reminder Email and a Convincing One"},
{date:"2026-10-21", day:20, title:"This One Subject Line Change and What Happened After"},
{date:"2026-10-23", day:21, title:"A Client Told Me My Email Was \"Too Short.\" Here's What Happened When They Sent It."},
{date:"2026-10-26", day:22, title:"Before/After: What This Email Rewrite Actually Did to Open Rates"},
{date:"2026-10-28", day:23, title:"A Client Asked Me to Write a Misleading Subject Line. I Said No. Here's Why."},
{date:"2026-10-30", day:24, title:"My First Email Copywriting Client Paid Me $50. Here's What I'd Charge Now."},
{date:"2026-11-02", day:25, title:"The Pitch That Flopped — and What I Changed After"},
{date:"2026-11-04", day:26, title:"What Nobody Tells You About Freelance Copywriting Month 1 vs Month 6"},
{date:"2026-11-06", day:27, title:"I Wrote a Full Abandoned Cart Sequence From Scratch — Full Process"},
{date:"2026-11-09", day:28, title:"Writing Emails When Nobody's Heard of the Brand — Building Trust With Cold Subscribers"},
{date:"2026-11-11", day:29, title:"How Curiosity Actually Works in Subject Lines (Without Being Clickbait)"},
{date:"2026-11-13", day:30, title:"30 Days of Email Copywriting Content — What Changed, What I Got Wrong, What's Next"}
];

function renderContentCard(){
  const tKey = todayKey();
  const card = document.getElementById('contentCard');
  const todayEntry = CONTENT_CALENDAR.find(c => c.date === tKey);

  if(todayEntry){
    card.className = 'content-card';
    card.innerHTML = `
      <div class="label">Posting today — Day ${todayEntry.day}</div>
      <div class="ctitle">${todayEntry.title}</div>
      <div class="cmeta">script → record → edit → post</div>
    `;
    return;
  }

  const upcoming = CONTENT_CALENDAR.find(c => c.date > tKey);
  card.className = 'content-card off';
  if(upcoming){
    const d = new Date(upcoming.date + 'T00:00:00');
    const label = d.toLocaleDateString(undefined, { weekday:'long', month:'short', day:'numeric' });
    card.innerHTML = `
      <div class="label">No post today</div>
      <div class="ctitle">Next up — Day ${upcoming.day}: ${upcoming.title}</div>
      <div class="next-hint">due ${label} — script it a day ahead if you can</div>
    `;
  } else {
    card.innerHTML = `
      <div class="label">Content calendar complete</div>
      <div class="ctitle">All 30 days posted — time to plan the next batch</div>
    `;
  }
}

function todayKey(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function formatDateLabel(){
  const d = new Date();
  return d.toLocaleDateString(undefined, { weekday:'long', month:'short', day:'numeric' });
}

const STORAGE_PREFIX = 'daily-sheet:';
let state = { checked: new Array(BLOCKS.length).fill(false) };
let streak = { count: 0, lastCompletedDate: null };

function readStored(key, fallback){
  try{
    const value = localStorage.getItem(STORAGE_PREFIX + key);
    return value ? JSON.parse(value) : fallback;
  }catch(e){
    return fallback;
  }
}

function writeStored(key, value){
  try{
    localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
  }catch(e){
    console.error('save failed', e);
  }
}

async function loadState(){
  state = readStored('day:' + todayKey(), { checked: new Array(BLOCKS.length).fill(false) });
  streak = readStored('streak', { count: 0, lastCompletedDate: null });
  render();
}

async function saveState(){
  writeStored('day:' + todayKey(), state);
}

async function saveStreak(){
  writeStored('streak', streak);
}

let toastTimer;
function showToast(message){
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 4200);
}

function sendNotification(title, body){
  showToast(body);
  if('Notification' in window && Notification.permission === 'granted'){
    new Notification(title, { body });
  }
}

async function enableNotifications(){
  if(!('Notification' in window)){
    showToast('This browser does not support notifications, but progress is still saved.');
    return;
  }
  const permission = await Notification.requestPermission();
  const button = document.getElementById('notifyBtn');
  if(permission === 'granted'){
    button.textContent = 'notifications on';
    sendNotification('Daily Sheet', 'You are set. I will celebrate each completed milestone.');
  }else{
    showToast('Notifications are off. You will still get encouragement inside the sheet.');
  }
}

function dayBefore(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0,10);
}

async function handleCompletionCheck(){
  const allDone = state.checked.every(Boolean);
  const tKey = todayKey();
  if(allDone && streak.lastCompletedDate !== tKey){
    if(streak.lastCompletedDate === dayBefore(tKey)){
      streak.count += 1;
    } else {
      streak.count = 1;
    }
    streak.lastCompletedDate = tKey;
    await saveStreak();
  }
}

function render(){
  document.getElementById('dateLabel').textContent = formatDateLabel();
  document.getElementById('streakNum').textContent = streak.count;
  renderContentCard();

  const container = document.getElementById('blocks');
  container.innerHTML = '';
  BLOCKS.forEach((b, i) => {
    const done = state.checked[i];
    const row = document.createElement('div');
    row.className = 'block';
    row.innerHTML = `
      <div class="checkbox ${done ? 'checked' : ''}" data-idx="${i}"></div>
      <div class="block-body">
        <div class="block-time">${b.time}</div>
        <div class="block-title ${done ? 'done' : ''}">${b.title}</div>
        <div class="block-desc">${b.desc}</div>
        ${b.protectedNote ? `<span class="protected">${b.protectedNote}</span>` : ''}
      </div>
    `;
    container.appendChild(row);
  });

  container.querySelectorAll('.checkbox').forEach(cb => {
    cb.addEventListener('click', async () => {
      const idx = parseInt(cb.getAttribute('data-idx'));
      state.checked[idx] = !state.checked[idx];
      await saveState();
      if(state.checked[idx]){
        const doneCount = state.checked.filter(Boolean).length;
        if(doneCount === BLOCKS.length){
          await handleCompletionCheck();
          sendNotification('Day complete', streak.count > 1
            ? `Six blocks finished. Your streak is now ${streak.count} days.`
            : 'Six blocks finished. That is a complete day.');
        }else if(doneCount === 3){
          sendNotification('Halfway there', 'Three blocks down. Keep the next move small and keep going.');
        }else{
          showToast(`Block complete. ${BLOCKS.length - doneCount} more to finish today.`);
        }
      }
      render();
    });
  });

  const doneCount = state.checked.filter(Boolean).length;
  document.getElementById('progressLabel').textContent = `${doneCount} / ${BLOCKS.length}`;
  document.getElementById('progressFill').style.width = (doneCount / BLOCKS.length * 100) + '%';
}

document.getElementById('resetBtn').addEventListener('click', async () => {
  state = { checked: new Array(BLOCKS.length).fill(false) };
  await saveState();
  showToast('Today is reset. A clean page is ready when you are.');
  render();
});

document.getElementById('notifyBtn').addEventListener('click', enableNotifications);

if('Notification' in window && Notification.permission === 'granted'){
  document.getElementById('notifyBtn').textContent = 'notifications on';
}

loadState();
</script>
</body>
</html>
