<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Builder OS</title>
  <script>
    const token = localStorage.getItem('daily_sheet_token');
    if (token) {
      window.location.replace('/today.html');
    } else {
      window.location.replace('/login.html');
    }
  </script>
</head>
<body style="background:#EDE7D6; font-family:'Lora', serif; text-align:center; padding-top:80px; color:#23261F;">
  <h2>Daily Sheet Tracker</h2>
  <p style="font-family:monospace; color:#5B5A4E;">Redirecting to your dashboard...</p>
  <p><a href="/login.html" style="color:#1F5C52;">Click here if you are not redirected automatically.</a></p>
</body>
</html>
